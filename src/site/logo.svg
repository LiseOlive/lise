  <!-- Olive droite (arrière-plan) -->
  <g transform="translate(68, 49) rotate(18)">
    <ellipse cx="0" cy="0" rx="13" ry="19" fill="#2d3822"/>
    <ellipse cx="-4" cy="-3" rx="3.5" ry="8.5" fill="#5b6e44" opacity="0.85"/>
  </g>

  <!-- Olive gauche (premier plan) -->
  <g transform="translate(50, 60) rotate(-15)">
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="#3c4c2d"/>
    <ellipse cx="-4" cy="-3" rx="3.8" ry="9.5" fill="#6c8052" opacity="0.85"/>
  </g>
</svg>
