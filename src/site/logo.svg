<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Branche / Tige -->
  <path d="M 22 80 C 26 65, 38 45, 82 22" fill="none" stroke="#9ba882" stroke-width="5" stroke-linecap="round"/>

  <!-- Feuille supérieure droite (sauge clair) -->
  <path d="M 54 36 C 52 18, 70 12, 78 24 C 72 33, 60 38, 54 36 Z" fill="#88a56f"/>

  <!-- Feuille gauche (vert olive moyen) -->
